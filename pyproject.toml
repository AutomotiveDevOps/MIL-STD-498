[project]
name = "mil-std-498-strictdoc"
version = "0.1.0"
description = "MIL-STD-498 document templates converted to StrictDoc format"
authors = [
    {name = "Claude Sonnet 4", email = "claude@anthropic.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "strictdoc>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2020.1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [] 