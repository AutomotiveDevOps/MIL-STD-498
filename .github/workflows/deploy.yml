          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>MIL-STD-498 Documentation</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  h2 { color: #666; margin-top: 30px; }
                  .section { margin: 20px 0; }
                  .doc-list { list-style: none; padding: 0; }
                  .doc-list li { margin: 10px 0; }
                  .doc-list a { color: #0066cc; text-decoration: none; }
                  .doc-list a:hover { text-decoration: underline; }
                  .description { color: #666; font-size: 0.9em; margin-left: 20px; }
              </style>
          </head>
          <body>
              <h1>MIL-STD-498 Documentation</h1>
              <p>This repository contains MIL-STD-498 (Military Standard 498) document templates in multiple formats.</p>
              
              <div class="section">
                  <h2>StrictDoc Generated Documentation (from Markdown)</h2>
                  <ul class="doc-list">
                      <li><a href="strictdoc_md/html/SRS.html.md.html">SRS - Software Requirements Specification</a>
                          <div class="description">Defines software requirements and acceptance criteria</div></li>
                      <li><a href="strictdoc_md/html/SDD.html.md.html">SDD - Software Design Description</a>
                          <div class="description">Software architectural and detailed design</div></li>
