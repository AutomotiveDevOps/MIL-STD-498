name: Deploy StrictDoc Documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install strictdoc beautifulsoup4 html2text

      - name: Generate HTML from StrictDoc files
        run: |
          # Generate HTML from Markdown-based StrictDoc files
          strictdoc export --formats=html --output-dir=docs/strictdoc_md strictdoc_md/
          
          # Generate HTML from HTML-based StrictDoc files  
          strictdoc export --formats=html --output-dir=docs/strictdoc_html strictdoc_html/
          
          # Copy original HTML files
          mkdir -p docs/original_html
          find html -name "*.html" -exec cp {} docs/original_html/ \;
          
          # Create index page
          cat > docs/index.html << 'EOF'
