                      <li><a href="strictdoc_md/html/STR.html.md.html">STR - Software Test Report</a>
                          <div class="description">Test execution results and reports</div></li>
                      <li><a href="strictdoc_md/html/SIP.html.md.html">SIP - Software Installation Plan</a>
                          <div class="description">Software installation procedures</div></li>
                      <li><a href="strictdoc_md/html/STRP.html.md.html">STRP - Software Transition Plan</a>
