                  <div class="info-box">
                      <strong>About:</strong> This site contains MIL-STD-498 document templates. Each document is available in both original HTML format and StrictDoc-generated HTML format. MIL-STD-498 is a United States military standard that defines the software development and documentation process for software systems.
                  </div>

                  <div class="section-header">
