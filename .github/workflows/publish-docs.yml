name: Generate and Publish Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install strictdoc beautifulsoup4 html2text

      - name: Generate StrictDoc HTML documentation
        run: |
          cd strictdoc_documents
          uv run strictdoc export --formats=html --output-dir=../docs/ .

      - name: Copy original MIL-STD-498 HTML files
        run: |
          mkdir -p docs/original_html
          cp ./*.html docs/original_html/

      - name: Create index page
        run: |
          echo '<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>MIL-STD-498 Documentation</title>
          </head>
          <body>
            <h1>MIL-STD-498 Documentation</h1>
            <h2>StrictDoc HTML Files</h2>
            <ul>' > docs/index.html
          for f in docs/strictdoc_documents/*.html; do
            fname=$(basename "$f")
            echo "<li><a href=\"strictdoc_documents/$fname\">$fname</a></li>" >> docs/index.html
          done
          echo '</ul>' >> docs/index.html
          echo '<h2>Original MIL-STD-498 HTML Files</h2><ul>' >> docs/index.html
          for f in docs/original_html/*.html; do
            fname=$(basename "$f")
            echo "<li><a href=\"original_html/$fname\">$fname</a></li>" >> docs/index.html
          done
          echo '</ul>' >> docs/index.html
          echo '<p><a href="strictdoc_documents/INDEX.md">Documentation Index (Markdown)</a></p>' >> docs/index.html
          echo '</body></html>' >> docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 